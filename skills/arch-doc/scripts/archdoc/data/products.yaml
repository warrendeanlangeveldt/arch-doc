# Cloud product names the `layer` check rejects in a `layer: logical`
# document. A logical design names what a thing does ("secrets store",
# "edge gateway"), not the product that does it.
#
# Names are matched case-sensitively on word boundaries, as written here, so
# "Key Vault" is caught and "a key vault for the team" is not. A generic word
# that is also a product ("Functions", "Monitor", "Lambda") is listed only
# with its vendor prefix, so ordinary prose is not flagged.
#
# Vendor names on their own ("Azure", "AWS", "Google Cloud") are not listed:
# a logical design may say whose cloud it is about. Only service names are.
#
# The check adds the profile's systems that have a logical_name (their
# `name` is the product) unless the system has `keep_name: true`, and the
# document's own banned_terms. arch-doc.yaml `allowed_terms` lets a design
# keep a name it deliberately uses.

