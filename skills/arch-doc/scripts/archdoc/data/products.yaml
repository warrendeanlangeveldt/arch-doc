# Physical detail that is banned in a logical document whatever the vendor:
# addresses, SKUs and resource names. Each is a regular expression.
patterns:
  ip-address: '(?<![\w.])(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/\d{1,2})?(?![\w.]*\d)'
  ipv6-address: '(?<![\w:])(?:[0-9A-Fa-f]{1,4}:){1,7}:(?:[0-9A-Fa-f]{1,4})?(?:/\d{1,3})?(?![\w:])'
  azure-vm-sku: '\bStandard_[A-Z][A-Za-z0-9]*_?[A-Za-z0-9_]*\b'
  azure-plan-sku: '\b[PSBI][1-3]v[2-3]\b'
  aws-instance-type: '\b(?:t2|t3|t3a|t4g|m5|m5a|m6i|m6g|m7g|c5|c6i|c6g|c7g|r5|r6i|r6g|x2idn|i3|g4dn|g5|p3|p4d)\.(?:nano|micro|small|medium|large|\d*xlarge|metal)\b'
  gcp-machine-type: '\b(?:e2|n1|n2|n2d|c2|c3|t2d|m1|m2|a2)-(?:standard|highmem|highcpu|micro|small|medium)(?:-\d+)?\b'
  aws-arn: '\barn:aws[a-z-]*:[^\s,;)]+'
  azure-resource-id: '/subscriptions/[0-9A-Fa-f-]{36}'
  cloud-hostname: '\b[\w-]+(?:\.[\w-]+)*\.(?:azurewebsites\.net|azurecr\.io|blob\.core\.windows\.net|vault\.azure\.net|database\.windows\.net|servicebus\.windows\.net|azure-api\.net|azurefd\.net|cloudapp\.azure\.com|amazonaws\.com|cloudfront\.net|run\.app|appspot\.com|googleapis\.com)\b'
  azure-resource-name: '\b(?:rg|kv|vnet|snet|nsg|appgw|aks|acr|apim|evhns|sbns|cosmos|appi)-[a-z0-9]+(?:-[a-z0-9]+)+\b'
