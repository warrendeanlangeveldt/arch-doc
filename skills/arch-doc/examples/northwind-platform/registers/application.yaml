# Application register (application). One record per item; ids are APP-nn.
# Fields: id, title, status
#   purpose: text
#   state: current | target | both
#   change: new | changed | unchanged | retired
#   hosting: saas | cloud | on-prem | hybrid
#   role: source | target | both | none
#   lifecycle: strategic | invest | tolerate | migrate | retire
#   criticality: high | medium | low
#   repository: text
#   owner: text
# Status: planned (not-started), in-build (partial), live (done), retired (done)
# Any value may be TBC or "TBC: <owner>"; a bare TBC takes the record's owner.
- id: APP-01
  title: Northwind Platform
  purpose: Shared integration and event services for internal teams
  state: target
  change: new
  hosting: cloud
  role: both
  lifecycle: invest
  criticality: high
  owner: Head of Platform
