# Retired component register (retired-component). One record per item; ids are RET-nn.
# Fields: id, title, status
#   object_type: application | component | integration | technology | data
#   replacement: text
#   date: date
#   data_retention: text
#   records_action: text
#   owner: text
# Status: planned (not-started), in-progress (partial), retired (done)
# Any value may be TBC or "TBC: <owner>"; a bare TBC takes the record's owner.
- id: RET-01
  title: Legacy tracking lookup
  object_type: application
  replacement: Tracking API and the website
  date: '2027-06-30'
  data_retention: Scan history not migrated (ADR-07); database exported to the archive, then destroyed
  records_action: Retire the business application and its CIs
  owner: Customer service manager
  status: planned

