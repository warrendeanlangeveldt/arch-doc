# Runbook register (runbook). One record per item; ids are RBK-nn.
# Fields: id, title, status
#   required_when: text
#   location: text
#   tested: yes | no
#   test_date: date
#   tester: text
#   outcome: pass | fail | not-run
#   owner: text
# Status: required (not-started), draft (partial), published (partial), tested (done)
# Any value may be TBC or "TBC: <owner>"; a bare TBC takes the record's owner.
- id: RBK-01
  title: Replay dead-lettered scans and status changes
  required_when: Dead-letter alert on a pts subscription
  location: ServiceNow knowledge base, Parcels
  tested: 'yes'
  test_date: '2026-10-15'
  tester: Integration lead
  outcome: pass
  owner: Integration lead
  status: tested

