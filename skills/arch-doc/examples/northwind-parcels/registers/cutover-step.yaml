# Cutover step register (cutover-step). One record per item; ids are CUT-nn.
# Fields: id, title, status
#   order: number
#   start: text
#   finish: text
#   after: refs:cutover-step
#   rollback_point: yes | no
#   owner: text
# Status: planned (not-started), rehearsed (partial), done (done)
# Any value may be TBC or "TBC: <owner>"; a bare TBC takes the record's owner.
