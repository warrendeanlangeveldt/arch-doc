# Architecture checkpoint register (checkpoint). One record per item; ids are CHK-nn.
# Fields: id, title, status
#   stage: initial | detailed | pre-production | post-implementation | other
#   timing: text
#   date: date
#   forum: ref:forum
#   purpose: text
#   evidence: text
#   owner: text
# Status: planned (not-started), ready (partial), passed (done), failed (not-started)
# Any value may be TBC or "TBC: <owner>"; a bare TBC takes the record's owner.
