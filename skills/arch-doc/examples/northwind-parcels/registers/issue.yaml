# Issue register (issue). One record per item; ids are ISS-nn.
# Fields: id, title, status
#   severity: low | medium | high | critical
#   impact: text
#   raised: date
#   due: date
#   owner: text
# Status: open (not-started), in-progress (partial), resolved (done), closed (done)
# Any value may be TBC or "TBC: <owner>"; a bare TBC takes the record's owner.
