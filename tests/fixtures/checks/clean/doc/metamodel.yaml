viewpoints:
  solution-context:
    title: Solution Context
    purpose: the solution among its requirements, capabilities, applications, data and technology
    ea:
      coreea: Core EA Master Diagram
      archimate: Layered
      togaf: Solution Concept
      essential: Application Provider Summary
  project-traceability:
    title: Requirement Traceability
    purpose: requirements traced to what satisfies or realises them
    ea:
      coreea: Project Context
      archimate: Requirements Realization
      togaf: Project Context
      essential: null
