# The seed metamodel trimmed to five chapters for the checks fixtures.
# test_checks.py asserts these chapters still match the seed's.
name: checks-fixture
version: 1
document_kinds:
  capability:
    purpose: a platform or zone other designs build on
    excludes:
    - application/channels
  solution:
    purpose: one solution, on the platforms it depends on
deck:
  runs:
    1: Why and what
    2: The design
    3: Running it
    4: Delivering and governing
chapters:
- key: application
  title: Application & Component Architecture
  question: What are the parts, and what does each do?
  story: the applications and components in scope and the environments they run in
  picture:
    kind: map
    from: application
  deck:
    run: 2
  viewpoints:
  - application-context
  - application-components
  sections:
  - key: views
    title: Architecture Views
    when: systems.ea_metamodel
    guidance: Show the application context and component views with VIEW directives.
    artefacts: []
  - key: scope
    title: Application Scope
    guidance: List each application and component the design adds, changes or retires, with its purpose,
      owner and criticality.
    artefacts:
    - application where state=target|both
  - key: components
    title: Component Design
    guidance: 'Describe each component: what it does, where it runs, what data it holds, the interfaces
      it exposes or calls, and who owns it.'
    artefacts:
    - component
  - key: environments
    title: Environments
    guidance: List the environments, their purpose, the data classification each may hold, how access
      is controlled and how data is refreshed or masked.
    artefacts:
    - environment
  - key: channels
    title: User Experience & Channels
    guidance: List each user group, the channel they use, how they sign in, how their access is decided
      and the journeys that matter most.
    artefacts: []
- key: integration
  title: Integration & API Architecture
  question: How does it talk to everything else?
  story: every integration, its contract and what happens when it fails
  picture:
    kind: map
    from: integration
  deck:
    run: 2
  viewpoints:
  - integration-flows
  sections:
  - key: views
    title: Architecture Views
    when: systems.ea_metamodel
    guidance: Show the integration flow view with a VIEW directive.
    artefacts: []
  - key: overview
    title: Integration Overview
    guidance: 'List every integration: source, target, interface, data, pattern, protocol, trigger and
      criticality. The register is the source of truth; prose describes the shape, not the rows.'
    artefacts:
    - integration where state=target
  - key: contracts
    title: Interface Contracts
    guidance: 'For each interface that is new or changed, give the contract a builder needs at design
      level: operations, payload, authentication, versioning and error behaviour. Field-level detail can
      sit in a linked specification.'
    artefacts: []
  - key: failure-handling
    title: Integration Failure Handling
    guidance: For each integration, name the failure that matters, its business impact, how we detect
      it, how we recover and who acts.
    covers: integration
    artefacts: []
  - key: acceptance
    title: Integration Acceptance Criteria
    guidance: State what must be true before the integrations are accepted and the evidence for each.
    artefacts:
    - acceptance-item where stage=integration
- key: decisions
  title: Local Architecture Decisions, Deviations & Exceptions
  question: What did we decide, and where do we depart from the standard?
  story: the decisions taken in this design and every departure needing approval
  picture:
    kind: bars
    from: decision
    by: status
  deck:
    run: 3
  viewpoints: []
  sections:
  - key: decisions
    title: Local Architecture Decisions
    guidance: 'Record each decision this design takes: the context, the options considered, the choice,
      why, and what follows from it, including any technical debt taken on.'
    artefacts:
    - decision
  - key: deviations
    title: Parent Architecture Deviations
    guidance: 'Record each departure from the parent or reference architecture: what it required, what
      we do instead, why, the impact and whether approval is needed.'
    artefacts:
    - exception where kind=deviation
  - key: exceptions
    title: Standard Exceptions
    guidance: 'Record each exception to an organisation standard: the standard, the exception, the reason,
      the risk, the compensating control and when it expires.'
    artefacts:
    - exception where kind=standard
  - key: view-exceptions
    title: View Exceptions
    when: systems.ea_metamodel
    guidance: Record each required view that was not produced, why, the impact and what compensates for
      it.
    artefacts:
    - exception where kind=view
- key: risks
  title: Risks, Issues & Dependencies
  question: What could go wrong, and what already has?
  story: the risks, issues and dependencies a reviewer must weigh
  picture:
    kind: heatmap
    from: risk
  deck:
    run: 4
  viewpoints:
  - control-traceability
  sections:
  - key: architecture-risks
    title: Architecture Risks
    guidance: 'Record each design risk: the cause, the consequence, likelihood, impact, rating, mitigation
      and owner.'
    artefacts:
    - risk where category=architecture
  - key: operational-risks
    title: Operational Risks
    guidance: Record each risk to running the service, its mitigation, the residual rating and owner.
    artefacts:
    - risk where category=operational
  - key: issues
    title: Issues
    guidance: Record what has already gone wrong or is blocking, its impact, owner and due date.
    artefacts:
    - issue
  - key: dependencies
    title: Dependencies
    guidance: 'Track each dependency: owner, date required, impact if late, and status.'
    artefacts:
    - dependency
- key: appendix
  title: Appendix
  question: What does a reader need to look things up?
  story: the glossary and the reference material behind the views
  picture:
    kind: bars
    from: registers
  deck:
    run: 4
    min_slides: 2
  viewpoints: []
  sections:
  - key: glossary
    title: Glossary
    guidance: Define the terms and acronyms a reviewer outside the team would not know.
    artefacts:
    - glossary-term
  - key: required-views
    title: Required Diagrams & Views
    guidance: List every diagram and view the document needs, whether it is required, its purpose and
      its source.
    artefacts: []
  - key: object-guide
    title: Architecture Model Object Guide
    when: systems.ea_metamodel
    guidance: Summarise the model behind the views with a CATALOGUE directive, and say how each object
      type is used in this document.
    artefacts: []
  - key: repository-views
    title: '{p:systems.ea_repository.name} Views'
    when: systems.ea_repository
    guidance: List the views held in {p:systems.ea_repository.name}, what each is required for and the
      object types it shows.
    artefacts: []
artefact_types:
  business-requirement:
    label: Business requirement
    prefix: BR
    fields:
      source: text
      priority:
      - must
      - should
      - could
      - wont
      response: text
      acceptance: text
      satisfied_by: list
      owner: text
    labels:
      title: Requirement
      response: Design response
    columns:
    - id
    - title
    - source
    - priority
    - response
    - status
    status:
      proposed: not-started
      agreed: partial
      designed: partial
      verified: done
      deferred: not-started
      withdrawn: done
  functional-requirement:
    label: Functional requirement
    prefix: FR
    fields:
      traces_to: refs:business-requirement
      priority:
      - must
      - should
      - could
      - wont
      response: text
      acceptance: text
      satisfied_by: list
      owner: text
    labels:
