      traces_to: Traces to
      response: Design response
    aliases:
      traces_to: [source]
    columns:
    - id
    - title
    - traces_to
    - priority
    - response
    - status
    status:
      proposed: not-started
      agreed: partial
      designed: partial
      verified: done
      deferred: not-started
      withdrawn: done
  nfr:
