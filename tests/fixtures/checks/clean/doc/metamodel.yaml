      engaged: partial
      signed-off: done
  forum:
    label: Governance forum
    prefix: FOR
    fields:
      short: text
      role:
      - design-authority
      - change
      - security
      - data
      - service-transition
      - steering
      - other
      purpose: text
      decision: text
      cadence: text
      owner: text
    labels:
      title: Forum
      decision: Decision or input
    columns:
    - id
    - title
    - purpose
    - decision
    - status
    status:
      pending: not-started
      scheduled: partial
      conditional: partial
      approved: done
      rejected: not-started
  checkpoint:
    label: Architecture checkpoint
    prefix: CHK
    fields:
      stage:
      - initial
      - detailed
      - pre-production
      - post-implementation
      - other
      timing: text
      date: date
      forum: ref:forum
      purpose: text
      evidence: text
      owner: text
    labels:
      title: Checkpoint
    columns:
    - id
    - title
    - timing
    - forum
    - evidence
    - status
    status:
      planned: not-started
      ready: partial
      passed: done
      failed: not-started
  decision:
    label: Architecture decision
    prefix: ADR
    fields:
      context: text
      options: text
      rationale: text
      consequence: text
      debt:
      - none
      - accepted
      - to-repay
      date: date
      owner: text
    labels:
